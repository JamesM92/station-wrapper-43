name: dev-image

# Builds the ONE image on every dev push, smoke-tests it, and publishes :dev and an
# immutable :dev-<short-sha>, so a fix can be tested on the server with `compose pull`
# before it is merged to main. Nothing is pushed if the smoke test fails.
#
# Pushes to GitHub's container registry with the workflow's own token (no secret to set up).
on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE: station-wrapper-43

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build, smoke-test, push
        run: |
          set -euo pipefail
          image="$REGISTRY/$(echo "${{ github.repository_owner }}" | tr A-Z a-z)/$IMAGE"
          sha="$(echo "${{ github.sha }}" | cut -c1-7)"
          docker build -t "$image:dev" -t "$image:dev-$sha" \
            --build-arg BUILD_REF="dev-$sha" --build-arg BUILD_SHA="$sha" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
          scripts/smoke-image.sh "$image:dev"
          docker run --rm aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --exit-code 0 "$image:dev" || true
          docker push "$image:dev"
          docker push "$image:dev-$sha"
